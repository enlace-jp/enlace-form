<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENLACE — 管理画面</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1a1a; --bg2: #242424; --bg3: #2e2e2e;
  --rose: #c9967a; --rose-light: #e8b49a; --rose-pale: rgba(201,150,122,0.12);
  --cream: #faf8f5; --muted: #888; --border: rgba(201,150,122,0.2);
  --green: #4caf89; --amber: #e8a838; --red: #e86060; --blue: #6b9fd4;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--cream); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:300; min-height:100vh; }
.header { background:var(--bg2); border-bottom:1px solid var(--border); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.logo { font-family:'Cormorant Garamond',serif; font-size:24px; letter-spacing:0.15em; color:var(--cream); }
.logo span { color:var(--rose); }
.header-right { display:flex; align-items:center; gap:16px; }
.refresh-btn { padding:8px 20px; border:1px solid var(--border); border-radius:3px; background:transparent; color:var(--rose); font-family:'Zen Kaku Gothic New',sans-serif; font-size:12px; letter-spacing:0.1em; cursor:pointer; transition:all 0.2s; }
.refresh-btn:hover { background:var(--rose-pale); }
.last-updated { font-size:11px; color:var(--muted); }
.nav { display:flex; border-bottom:1px solid var(--border); padding:0 32px; background:var(--bg2); }
.nav-tab { padding:14px 24px; font-size:12px; letter-spacing:0.1em; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
.nav-tab.active { color:var(--rose); border-bottom-color:var(--rose); }
.nav-tab:hover { color:var(--cream); }
.main { padding:32px; max-width:1400px; margin:0 auto; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
.stat-card { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:20px 24px; }
.stat-label { font-size:11px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
.stat-value { font-family:'Cormorant Garamond',serif; font-size:36px; color:var(--rose); font-weight:300; }
.stat-sub { font-size:11px; color:var(--muted); margin-top:4px; }
.section-title { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--cream); font-weight:300; margin-bottom:20px; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.participants-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; margin-bottom:40px; }
.p-card { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:20px; cursor:pointer; transition:border-color 0.2s; }
.p-card:hover { border-color:var(--rose); }
.p-card.male { border-left:3px solid var(--blue); }
.p-card.female { border-left:3px solid var(--rose); }
.p-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.p-name { font-family:'Cormorant Garamond',serif; font-size:20px; }
.p-gender { font-size:10px; letter-spacing:0.15em; padding:3px 8px; border-radius:2px; }
.p-gender.male { background:rgba(107,159,212,0.15); color:var(--blue); }
.p-gender.female { background:var(--rose-pale); color:var(--rose); }
.p-detail { font-size:12px; color:var(--muted); margin-bottom:4px; }
.p-detail span { color:var(--cream); }
.p-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; }
.p-tag { font-size:10px; padding:2px 8px; border:1px solid var(--border); border-radius:2px; color:var(--muted); }
.score-table-wrap { overflow-x:auto; margin-bottom:40px; }
.score-table { width:100%; border-collapse:collapse; font-size:13px; }
.score-table th { background:var(--bg3); color:var(--muted); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:12px 16px; text-align:left; font-weight:400; border-bottom:1px solid var(--border); }
.score-table td { padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
.score-table tr:hover td { background:rgba(255,255,255,0.02); }
.score-bar { display:flex; align-items:center; gap:8px; }
.score-bar-track { flex:1; height:3px; background:rgba(255,255,255,0.08); border-radius:2px; min-width:60px; }
.score-bar-fill { height:100%; border-radius:2px; }
.score-bar-fill.compat { background:var(--blue); }
.score-bar-fill.priority { background:var(--rose); }
.score-bar-fill.total { background:var(--green); }
.score-num { font-family:'Cormorant Garamond',serif; font-size:18px; min-width:36px; text-align:right; }
.badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:3px 8px; border-radius:2px; }
.badge.high { background:rgba(76,175,137,0.15); color:var(--green); }
.badge.mid { background:rgba(232,168,56,0.15); color:var(--amber); }
.badge.low { background:rgba(232,96,96,0.1); color:var(--red); }
.detail-row { display:none; background:var(--bg3); }
.detail-row.open { display:table-row; }
.detail-box { padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.detail-section { background:var(--bg2); border-radius:6px; padding:14px; }
.detail-title { font-size:10px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
.detail-item { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:12px; }
.detail-item:last-child { border-bottom:none; }
.detail-item-label { color:var(--muted); }
.detail-item-score { font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--cream); }
.detail-item-score.boosted { color:var(--rose); }
.match-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:40px; }
.match-card { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:24px; }
.match-card-title { font-size:11px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; margin-bottom:16px; }
.match-pair { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.match-pair:last-child { border-bottom:none; }
.match-person { flex:1; }
.match-person-name { font-size:14px; color:var(--cream); margin-bottom:2px; }
.match-person-sub { font-size:11px; color:var(--muted); }
.loading { text-align:center; padding:80px; color:var(--muted); font-size:13px; }
.loading-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--rose); margin:0 3px; animation:blink 1.2s infinite; }
.loading-dot:nth-child(2) { animation-delay:0.2s; }
.loading-dot:nth-child(3) { animation-delay:0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
.empty { text-align:center; padding:60px; color:var(--muted); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; display:none; align-items:center; justify-content:center; padding:24px; }
.modal-overlay.open { display:flex; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:12px; width:100%; max-width:560px; max-height:80vh; overflow-y:auto; padding:32px; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.modal-name { font-family:'Cormorant Garamond',serif; font-size:28px; }
.modal-close { background:none; border:none; color:var(--muted); font-size:24px; cursor:pointer; }
.modal-row { display:flex; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; }
.modal-key { color:var(--muted); width:140px; flex-shrink:0; }
.modal-val { color:var(--cream); flex:1; }
.expand-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:4px 8px; }
.expand-btn:hover { color:var(--rose); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">EN<span>L</span>ACE <span style="font-size:13px;color:var(--muted);letter-spacing:0.1em;font-family:'Zen Kaku Gothic New',sans-serif">管理画面</span></div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" onclick="loadData()">↺ 更新</button>
  </div>
</div>

<div class="nav">
  <div class="nav-tab active" onclick="switchTab('participants')">参加者一覧</div>
  <div class="nav-tab" onclick="switchTab('scores')">相性スコア</div>
  <div class="nav-tab" onclick="switchTab('matching')">マッチング管理</div>
</div>

<div class="main">
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">総参加者</div>
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-sub">回答済み</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">男性</div>
      <div class="stat-value" id="statMale" style="color:var(--blue)">—</div>
      <div class="stat-sub">人</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">女性</div>
      <div class="stat-value" id="statFemale">—</div>
      <div class="stat-sub">人</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">高相性ペア</div>
      <div class="stat-value" id="statPairs" style="color:var(--green)">—</div>
      <div class="stat-sub">組（110点以上）</div>
    </div>
  </div>

  <div class="tab-content active" id="tab-participants">
    <div class="section-title">参加者一覧</div>
    <div id="participantsList" class="participants-grid">
      <div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
    </div>
  </div>

  <div class="tab-content" id="tab-scores">
    <div class="section-title">相性スコア一覧</div>
    <div class="score-table-wrap">
      <table class="score-table">
        <thead>
          <tr>
            <th>男性</th>
            <th>女性</th>
            <th>男→女スコア</th>
            <th>女→男スコア</th>
            <th>総合（平均）</th>
            <th>判定</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="scoreTableBody">
          <tr><td colspan="7" class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="tab-content" id="tab-matching">
    <div class="section-title">マッチング管理</div>
    <div class="match-grid" id="matchingGrid">
      <div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-name" id="modalName">—</div>
      <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvt130vZNQsGKpdVmepR7Uks8eQaJeCSfgk_bijFKwR4HuCulJS8bKxSJfEHPHStTmsw/exec';
let allParticipants = [];
let scores = [];

// 補完型ペア
const COMPLEMENT_PAIRS = [
  ['甘え上手', 'リード力がある'],
  ['聞き上手', '話し上手'],
  ['癒し系', '情熱的'],
  ['天然', 'しっかり者'],
  ['穏やか', '明るい'],
  ['マイペース', '積極的'],
];

// 類似型
const SIMILAR_TYPES = ['誠実', '好奇心旺盛', 'ポジティブ', '仕事好き', '知的', 'オシャレ好き', '気前がいい', '面白い'];

// 年収を数値に変換
function incomeToNum(str) {
  if (!str || str === '答えたくない') return -1;
  const map = { '300万未満': 250, '300〜400万': 350, '400〜500万': 450, '500〜600万': 550, '600〜800万': 700, '800〜1000万': 900, '1000万以上': 1200 };
  return map[str] || -1;
}

function idealIncomeToNum(str) {
  if (!str || str === 'こだわらない') return 0;
  const map = { '300万以上': 300, '400万以上': 400, '500万以上': 500, '600万以上': 600, '800万以上': 800, '1000万以上': 1000 };
  return map[str] || 0;
}

// 各項目の達成率（0〜1）を計算
function calcItemRates(viewer, target) {
  // 性格
  const vChar = (viewer['性格'] || '').split(',').map(s => s.trim()).filter(Boolean);
  const tChar = (target['性格'] || '').split(',').map(s => s.trim()).filter(Boolean);
  let charScore = 0;
  vChar.forEach(c => {
    if (SIMILAR_TYPES.includes(c) && tChar.includes(c)) charScore += 10;
    else {
      const pair = COMPLEMENT_PAIRS.find(p => p.includes(c));
      if (pair) { const comp = pair[0] === c ? pair[1] : pair[0]; if (tChar.includes(comp)) charScore += 15; }
    }
  });
  const charRate = Math.min(1, charScore / 75);

  // 趣味（1個でも合致で満点）
  const vHobby = (viewer['趣味'] || '').split(',').map(s => s.trim()).filter(Boolean);
  const tHobby = (target['趣味'] || '').split(',').map(s => s.trim()).filter(Boolean);
  const hobbyRate = vHobby.filter(h => tHobby.includes(h)).length >= 1 ? 1 : 0;

  // 顔タイプ
  const vFaceType = viewer['希望顔タイプ'] || '';
  const tFaceType = target['顔タイプ'] || '';
  const faceTypeRate = (vFaceType === 'こだわらない' || (vFaceType && tFaceType === vFaceType)) ? 1 : 0;

  // 顔の特徴（3個中の合致率）
  const vFace = (viewer['希望顔の特徴'] || '').split(',').map(s => s.trim()).filter(Boolean);
  const tFace = (target['顔の特徴'] || '').split(',').map(s => s.trim()).filter(Boolean);
  const faceRate = vFace.length > 0 ? vFace.filter(f => tFace.includes(f)).length / Math.min(vFace.length, 3) : 0;

  // 体形
  const vBody = (viewer['希望体形'] || '').split(',').map(s => s.trim()).filter(Boolean);
  const tBody = target['体形'] || '';
  const bodyRate = (vBody.includes('こだわらない') || vBody.some(b => tBody.includes(b))) ? 1 : 0;

  // 結婚意思
  const vMarriage = viewer['結婚意思'] || '';
  const tMarriage = target['結婚意思'] || '';
  const marriageRate = vMarriage === tMarriage ? 1 : (vMarriage === 'こだわらない' || tMarriage === 'こだわらない') ? 0.5 : 0;

  // 年齢
  const tAge = parseInt(target['年齢']) || 0;
  const vAgeMin = parseInt(viewer['希望年齢下限']) || 0;
  const vAgeMax = parseInt(viewer['希望年齢上限']) || 99;
  const ageRate = (tAge >= vAgeMin && tAge <= vAgeMax) ? 1 : 0;

  // 身長
  const tHeight = parseInt(target['身長']) || 0;
  const vHeightMin = parseInt(viewer['希望身長下限']) || 0;
  const vHeightMax = parseInt(viewer['希望身長上限']) || 999;
  const heightRate = (tHeight >= vHeightMin && tHeight <= vHeightMax) ? 1 : 0;

  // お酒
  const vAlcohol = viewer['希望お酒'] || '';
  const tAlcohol = target['お酒'] || '';
  let alcoholRate = 0;
  if (vAlcohol === 'こだわらない') alcoholRate = 1;
  else if (vAlcohol === '飲まない人がいい' && tAlcohol === '飲まない') alcoholRate = 1;
  else if (vAlcohol === '一緒に飲みたい' && (tAlcohol === 'たまに飲む' || tAlcohol === 'よく飲む')) alcoholRate = 1;

  // タバコ
  const vTobacco = viewer['希望タバコ'] || '';
  const tTobacco = target['タバコ'] || '';
  const tobaccoRate = (vTobacco === 'こだわらない' || (vTobacco.includes('吸わない') && tTobacco === '吸わない')) ? 1 : 0;

  // 学歴
  const vEdu = viewer['学歴へのこだわり'] || '';
  const tEdu = target['最終学歴'] || '';
  let eduRate = 0;
  if (vEdu === 'こだわらない') eduRate = 1;
  else if (vEdu === '大卒以上希望' && (tEdu === '大学卒' || tEdu === '大学院卒')) eduRate = 1;

  // 収入
  const vIncome = idealIncomeToNum(viewer['希望年収'] || '');
  const tIncome = incomeToNum(target['年収'] || '');
  let incomeRate = 0;
  if (vIncome === 0) incomeRate = 1;
  else if (tIncome === -1) incomeRate = 0;
  else if (tIncome >= vIncome) incomeRate = 1;

  return { charRate, hobbyRate, faceTypeRate, faceRate, bodyRate, marriageRate, ageRate, heightRate, alcoholRate, tobaccoRate, eduRate, incomeRate };
}

// 総合スコア計算（満点約150点）
function calcTotalScore(viewer, target) {
  const rates = calcItemRates(viewer, target);
  const lookImportance = parseInt(viewer['容姿重要度']) || 3;
  const lookMult = [1, 1, 1.1, 1.2, 1.35, 1.5][lookImportance] || 1;

  // 優先条件マッピング
  const priorityMap = {
    '顔・見た目': ['faceTypeRate', 'faceRate', 'bodyRate'],
    '性格・人柄': ['charRate'],
    '価値観の一致': ['marriageRate', 'alcoholRate', 'tobaccoRate'],
    '趣味・共通の話題': ['hobbyRate'],
    '結婚への真剣さ': ['marriageRate'],
    '収入・安定性': ['incomeRate'],
    '学歴・知性': ['eduRate'],
    '年齢': ['ageRate'],
    '誠実さ・信頼感': ['charRate'],
  };

  const p1 = viewer['重視条件1位'] || '';
  const p2 = viewer['重視条件2位'] || '';
  const p3 = viewer['重視条件3位'] || '';
  const boosted1 = priorityMap[p1] || [];
  const boosted2 = priorityMap[p2] || [];
  const boosted3 = priorityMap[p3] || [];

  // 各項目のスコア計算
  const items = [
    { key: 'charRate', label: '性格', isAppearance: false },
    { key: 'hobbyRate', label: '趣味', isAppearance: false },
    { key: 'faceTypeRate', label: '顔タイプ', isAppearance: true },
    { key: 'faceRate', label: '顔の特徴', isAppearance: true },
    { key: 'bodyRate', label: '体形', isAppearance: true },
    { key: 'marriageRate', label: '結婚意思', isAppearance: false },
    { key: 'ageRate', label: '年齢', isAppearance: false },
    { key: 'heightRate', label: '身長', isAppearance: false },
    { key: 'alcoholRate', label: 'お酒', isAppearance: false },
    { key: 'tobaccoRate', label: 'タバコ', isAppearance: false },
    { key: 'eduRate', label: '学歴', isAppearance: false },
    { key: 'incomeRate', label: '収入', isAppearance: false },
  ];

  let totalScore = 0;
  let details = {};

  items.forEach(item => {
    const rate = rates[item.key];
    let base = 10;
    // 容姿重要度の加算
    if (item.isAppearance) base *= lookMult;
    // 優先条件倍率
    let mult = 1;
    let boostLabel = '';
    if (boosted1.includes(item.key)) { mult = 3; boostLabel = '1位×3'; }
    else if (boosted2.includes(item.key)) { mult = 2; boostLabel = '2位×2'; }
    else if (boosted3.includes(item.key)) { mult = 1.5; boostLabel = '3位×1.5'; }

    const score = rate * base * mult;
    totalScore += score;
    details[item.label] = { score: Math.round(score * 10) / 10, rate, boosted: mult > 1, boostLabel, base: Math.round(base * 10) / 10 };
  });

  return { total: Math.round(totalScore), details };
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach((t,i) => t.classList.toggle('active', ['participants','scores','matching'][i]===tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

async function loadData() {
  document.getElementById('lastUpdated').textContent = '読み込み中...';
  try {
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    if (json.result === 'success') {
      allParticipants = json.participants || [];
      document.getElementById('lastUpdated').textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');
      renderAll();
    }
  } catch(e) {
    document.getElementById('lastUpdated').textContent = '読み込みエラー';
    document.getElementById('participantsList').innerHTML = '<div class="empty">データを取得できませんでした</div>';
  }
}

function renderAll() {
  const males = allParticipants.filter(p => p['性別']==='男性');
  const females = allParticipants.filter(p => p['性別']==='女性');
  document.getElementById('statTotal').textContent = allParticipants.length;
  document.getElementById('statMale').textContent = males.length;
  document.getElementById('statFemale').textContent = females.length;

  scores = [];
  males.forEach(m => {
    females.forEach(f => {
      const mScore = calcTotalScore(m, f);
      const fScore = calcTotalScore(f, m);
      const total = Math.round((mScore.total + fScore.total) / 2);
      scores.push({ male: m, female: f, mScore, fScore, total });
    });
  });
  scores.sort((a,b) => b.total - a.total);
  document.getElementById('statPairs').textContent = scores.filter(s => s.total >= 110).length;

  renderParticipants();
  renderScores();
  renderMatching();
}

function renderParticipants() {
  const el = document.getElementById('participantsList');
  if (!allParticipants.length) { el.innerHTML = '<div class="empty">まだ回答がありません</div>'; return; }
  el.innerHTML = allParticipants.map((p,i) => {
    const gender = p['性別']==='男性'?'male':'female';
    const nickname = p['ニックネーム']||p['姓']||'—';
    const hobbies = (p['趣味']||'').split(',').slice(0,3).map(h=>`<span class="p-tag">${h.trim()}</span>`).join('');
    return `<div class="p-card ${gender}" onclick="openModal(${i})">
      <div class="p-card-header">
        <div class="p-name">${nickname}</div>
        <span class="p-gender ${gender}">${p['性別']||'—'}</span>
      </div>
      <div class="p-detail">年齢 <span>${p['年齢']||'—'}</span></div>
      <div class="p-detail">居住地 <span>${p['居住地']||'—'}</span></div>
      <div class="p-detail">職種 <span>${p['職種']||'—'}</span></div>
      <div class="p-detail">結婚意思 <span>${p['結婚意思']||'—'}</span></div>
      <div class="p-detail">重視条件 <span>${p['重視条件1位']||'—'} > ${p['重視条件2位']||'—'} > ${p['重視条件3位']||'—'}</span></div>
      <div class="p-tags">${hobbies}</div>
    </div>`;
  }).join('');
}

function renderScores() {
  const tbody = document.getElementById('scoreTableBody');
  if (!scores.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">男女両方の回答が必要です</td></tr>'; return; }
  tbody.innerHTML = scores.map((s,i) => {
    const badge = s.total>=135?'<span class="badge" style="background:rgba(180,130,255,0.15);color:#b482ff">💫 運命</span>':s.total>=110?'<span class="badge high">🔥 高相性</span>':s.total>=85?'<span class="badge mid">◎ 良好</span>':s.total>=60?'<span class="badge low">△ 普通</span>':'<span style="color:var(--muted);font-size:12px">—</span>';
    return `<tr onclick="toggleDetail(${i})">
      <td>${s.male['ニックネーム']||s.male['姓']||'—'}</td>
      <td>${s.female['ニックネーム']||s.female['姓']||'—'}</td>
      <td>
        <div class="score-bar">
          <div class="score-bar-track"><div class="score-bar-fill compat" style="width:${Math.min(100,s.mScore.total/1.5)}%"></div></div>
          <div class="score-num" style="color:var(--blue)">${s.mScore.total}</div>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">男→女</div>
      </td>
      <td>
        <div class="score-bar">
          <div class="score-bar-track"><div class="score-bar-fill priority" style="width:${Math.min(100,s.fScore.total/1.5)}%"></div></div>
          <div class="score-num" style="color:var(--rose)">${s.fScore.total}</div>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">女→男</div>
      </td>
      <td>
        <div class="score-bar">
          <div class="score-bar-track"><div class="score-bar-fill total" style="width:${Math.min(100,s.total/1.5)}%"></div></div>
          <div class="score-num" style="color:var(--green)">${s.total}</div>
        </div>
      </td>
      <td>${badge}</td>
      <td><button class="expand-btn">詳細 ▾</button></td>
    </tr>
    <tr class="detail-row" id="detail-${i}">
      <td colspan="7">
        <div class="detail-box">
          <div class="detail-section">
            <div class="detail-title">スコア内訳（男性→女性） ${s.mScore.total}点</div>
            ${Object.entries(s.mScore.details).map(([k,v])=>`
              <div class="detail-item">
                <span class="detail-item-label">${k}${v.boosted?` <span style="color:var(--rose);font-size:10px">[${v.boostLabel}]</span>`:''}</span>
                <span class="detail-item-score ${v.boosted?'boosted':''}">${v.score}pt</span>
              </div>`).join('')}
          </div>
          <div class="detail-section">
            <div class="detail-title">スコア内訳（女性→男性） ${s.fScore.total}点</div>
            ${Object.entries(s.fScore.details).map(([k,v])=>`
              <div class="detail-item">
                <span class="detail-item-label">${k}${v.boosted?` <span style="color:var(--rose);font-size:10px">[${v.boostLabel}]</span>`:''}</span>
                <span class="detail-item-score ${v.boosted?'boosted':''}">${v.score}pt</span>
              </div>`).join('')}
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function toggleDetail(i) {
  const row = document.getElementById('detail-'+i);
  row.classList.toggle('open');
}

function renderMatching() {
  const el = document.getElementById('matchingGrid');
  const males = allParticipants.filter(p=>p['性別']==='男性');
  const females = allParticipants.filter(p=>p['性別']==='女性');
  if (!males.length||!females.length) { el.innerHTML='<div class="empty">男女両方の回答が必要です</div>'; return; }

  const maleMatches = males.map(m => {
    const best = scores.filter(s=>s.male===m).sort((a,b)=>b.total-a.total).slice(0,3);
    return { person:m, matches:best };
  });
  const femaleMatches = females.map(f => {
    const best = scores.filter(s=>s.female===f).sort((a,b)=>b.total-a.total).slice(0,3);
    return { person:f, matches:best };
  });

  el.innerHTML = `
    <div class="match-card">
      <div class="match-card-title">男性のおすすめ女性TOP3</div>
      ${maleMatches.map(({person,matches})=>`
        <div style="margin-bottom:16px">
          <div style="font-size:13px;color:var(--rose);margin-bottom:8px">${person['ニックネーム']||person['姓']||'—'}</div>
          ${matches.map((s,i)=>`
            <div class="match-pair">
              <div class="match-person">
                <div class="match-person-name">${i+1}. ${s.female['ニックネーム']||s.female['姓']||'—'}</div>
                <div class="match-person-sub">男→女:${s.mScore.total}点 女→男:${s.fScore.total}点</div>
              </div>
              <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:${s.total>=135?'#b482ff':s.total>=110?'var(--green)':s.total>=85?'var(--amber)':'var(--muted)'}">${s.total}</div>
            </div>`).join('')}
        </div>`).join('')}
    </div>
    <div class="match-card">
      <div class="match-card-title">女性のおすすめ男性TOP3</div>
      ${femaleMatches.map(({person,matches})=>`
        <div style="margin-bottom:16px">
          <div style="font-size:13px;color:var(--rose);margin-bottom:8px">${person['ニックネーム']||person['姓']||'—'}</div>
          ${matches.map((s,i)=>`
            <div class="match-pair">
              <div class="match-person">
                <div class="match-person-name">${i+1}. ${s.male['ニックネーム']||s.male['姓']||'—'}</div>
                <div class="match-person-sub">男→女:${s.mScore.total}点 女→男:${s.fScore.total}点</div>
              </div>
              <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:${s.total>=135?'#b482ff':s.total>=110?'var(--green)':s.total>=85?'var(--amber)':'var(--muted)'}">${s.total}</div>
            </div>`).join('')}
        </div>`).join('')}
    </div>`;
}

function openModal(index) {
  const p = allParticipants[index];
  document.getElementById('modalName').textContent = p['ニックネーム']||p['姓']||'—';
  const keys = ['姓','名','姓（ふりがな）','名（ふりがな）','性別','年齢','生年月日','出身地','居住地','休日','職種','年収','最終学歴','身長','体形','顔タイプ','性格','結婚意思','タバコ','お酒','趣味','重視条件1位','重視条件2位','重視条件3位','メッセージ'];
  document.getElementById('modalBody').innerHTML = keys.map(k => p[k]?`<div class="modal-row"><div class="modal-key">${k}</div><div class="modal-val">${p[k]}</div></div>`:'').join('');
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target===document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('open');
}

loadData();
</script>
</body>
</html>
